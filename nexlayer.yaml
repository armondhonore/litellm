application:
  name: litellm
  pods:
  - name: app
    image: ghcr.io/berriai/litellm:main-latest
    path: /
    servicePorts:
    - 4000
    vars:
      LITELLM_MASTER_KEY: sk-1234
      STORE_MODEL_IN_DB: "False"
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "3Gi"
