application:
  name: litellm
  pods:
  - name: app
    image: ghcr.io/berriai/litellm:main-latest
    path: /
    command: sh -c "printf 'model_list: []\ngeneral_settings:\n  master_key: sk-1234\n' > /tmp/config.yaml && exec litellm --config /tmp/config.yaml --port 4000 --host 0.0.0.0"
    servicePorts:
    - 4000
    vars:
      LITELLM_MASTER_KEY: sk-1234
      STORE_MODEL_IN_DB: "False"
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "3Gi"
